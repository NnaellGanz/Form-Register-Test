<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Robotics</title>
    <style>
        :root {
            --bg-color: #050505;
            --primary: #00f2ff;
            --text-color: #fff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        #loginSection {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        }

        .login-box {
            background: #111;
            padding: 40px;
            border: 1px solid var(--primary);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            text-align: center;
            width: 300px;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            box-sizing: border-box;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            border: none;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        #dashboardSection {
            display: none;
            padding: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.5rem;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 8px 20px;
            cursor: pointer;
            border-radius: 4px;
        }

        .logout-btn:hover {
            background: #ff4444;
            color: white;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #0f0f0f;
            border: 1px solid #333;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: #1a1a1a;
            color: var(--primary);
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        tr:hover {
            background-color: #161616;
        }

        .status-badge {
            background: rgba(0, 242, 255, 0.1);
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            border: 1px solid var(--primary);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div id="loginSection">
        <div class="login-box">
            <h2 style="color:var(--primary); margin-bottom:20px;">ADMIN ACCESS</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">LOGIN SYSTEM</button>
            <p id="errorMsg" style="color: #ff4444; font-size: 0.8rem; margin-top: 10px; display: none;">Akses Ditolak!</p>
        </div>
    </div>

    <div id="dashboardSection">
        <header>
            <h1>Data Pendaftar</h1>
            <button class="logout-btn" onclick="logout()">LOGOUT</button>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>Nama</th>
                        <th>Kelas</th>
                        <th>Hobi</th>
                        <th>Alasan</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data akan muncul di sini -->
                </tbody>
            </table>
            <div id="loadingData" class="loading">Mengambil data dari server...</div>
            <p id="noData" style="text-align: center; color: #666; margin-top: 20px; display:none;">Belum ada data pendaftar.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // --- PENTING: GANTI KONFIGURASI INI (SAMA PERSIS DENGAN INDEX.HTML) ---
        const firebaseConfig = {
            apiKey: "AIzaSyDog5AP5Mlsnl5SRzNxAVuse0wlI3lB5Zw",
    	    authDomain: "ekskul-9b7b2.firebaseapp.com",
    	    projectId: "ekskul-9b7b2",
    	    storageBucket: "ekskul-9b7b2.firebasestorage.app",
    	    messagingSenderId: "847874198829",
    	    appId: "1:847874198829:web:bc7a5887495ea7916597a4",
	};
        // -----------------------------------------------------------------------

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.login = function() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (user === 'admin' && pass === 'robot123') {
                sessionStorage.setItem('isAdmin', 'true');
                showDashboard();
                document.getElementById('errorMsg').style.display = 'none';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        window.logout = function() {
            sessionStorage.removeItem('isAdmin');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            loadData();
        }

        async function loadData() {
            const tableBody = document.getElementById('tableBody');
            const noData = document.getElementById('noData');
            const loading = document.getElementById('loadingData');
            
            loading.style.display = 'block';
            tableBody.innerHTML = '';

            try {
                const q = query(collection(db, "pendaftaran"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);

                loading.style.display = 'none';

                if (querySnapshot.empty) {
                    noData.style.display = 'block';
                } else {
                    noData.style.display = 'none';
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        const date = new Date(data.timestamp).toLocaleString();
                        const row = `
                            <tr>
                                <td style="color:#666; font-size:0.8rem;">${date}</td>
                                <td style="font-weight:bold; color: #fff;">${data.nama}</td>
                                <td><span class="status-badge">${data.kelas}</span></td>
                                <td>${data.hobi}</td>
                                <td style="color:#aaa; font-style:italic;">"${data.alasan}"</td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                }
            } catch (error) {
                loading.innerText = "Gagal mengambil  " + error.message;
                console.error("Error getting documents: ", error);
            }
        }

        if(sessionStorage.getItem('isAdmin') === 'true'){
            showDashboard();
        }
    </script>
</body>
</html>
