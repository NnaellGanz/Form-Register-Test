<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics Club Registration</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 20, 0.8);
            --primary: #00f2ff;
            --text-color: #e0e0e0;
            --input-bg: #111;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(0, 242, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
            backdrop-filter: blur(10px);
            position: relative; /* Penting untuk posisi absolut link admin */
            overflow: hidden;
            margin: 20px; /* Agar tidak mentok di layar HP */
        }

        /* Efek Garis Atas */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        /* Link Admin di Pojok Kanan Atas */
        .admin-top-link {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 0.8rem;
            z-index: 10;
        }

        .admin-top-link a {
            color: #666;
            text-decoration: none;
            border: 1px solid #333;
            padding: 5px 12px;
            border-radius: 4px;
            transition: 0.3s;
            background: rgba(0,0,0,0.5);
        }

        .admin-top-link a:hover {
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 242, 255, 0.4);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            margin-top: 10px;
            text-shadow: 0 0 5px rgba(0, 242, 255, 0.5);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #aaa;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid #333;
            border-radius: 5px;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 242, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 5px;
            margin-top: 10px;
        }

        button:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .alert {
            display: none;
            background: rgba(0, 242, 255, 0.1);
            border-left: 4px solid var(--primary);
            padding: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            color: var(--primary);
            display: none;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LINK ADMIN DIPINDAHKAN KE SINI (POJOK KANAN ATAS) -->
        <div class="admin-top-link">
            <a href="admin.html">Login Admin</a>
        </div>

        <h2>System Access</h2>
        <div id="successAlert" class="alert">Data berhasil dikirim ke server pusat.</div>
        <div id="loading" class="loading">Mengirim data...</div>
        
        <form id="regForm">
            <div class="form-group">
                <label for="nama">Identitas (Nama Lengkap)</label>
                <input type="text" id="nama" placeholder="Masukkan nama..." required>
            </div>

            <div class="form-group">
                <label for="kelas">Unit Kelas</label>
                <input type="text" id="kelas" placeholder="Contoh: X-RPL-1" required>
            </div>

            <div class="form-group">
                <label for="hobi">Hobi / Minat Teknis</label>
                <input type="text" id="hobi" placeholder="Coding, Rakit PC, Drone..." required>
            </div>

            <div class="form-group">
                <label for="alasan">Alasan Bergabung (Motivasi)</label>
                <textarea id="alasan" rows="4" placeholder="Mengapa ingin masuk ekskul robotika?" required></textarea>
            </div>

            <button type="submit" id="submitBtn">Submit Data</button>
        </form>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // --- PENTING: GANTI KONFIGURASI INI DENGAN PUNYA ANDA ---
        const firebaseConfig = {
            apiKey: "AIzaSyDog5AP5Mlsnl5SRzNxAVuse0wlI3lB5Zw",
    	    authDomain: "ekskul-9b7b2.firebaseapp.com",
    	    projectId: "ekskul-9b7b2",
     	    storageBucket: "ekskul-9b7b2.firebasestorage.app",
    	    messagingSenderId: "847874198829",
   	    appId: "1:847874198829:web:bc7a5887495ea7916597a4",
        };
        // -------------------------------------------------------

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('regForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const alertBox = document.getElementById('successAlert');

            btn.disabled = true;
            loading.style.display = 'block';
            alertBox.style.display = 'none';

            const data = {
                nama: document.getElementById('nama').value,
                kelas: document.getElementById('kelas').value,
                hobi: document.getElementById('hobi').value,
                alasan: document.getElementById('alasan').value,
                timestamp: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, "pendaftaran"), data);
                
                alertBox.style.display = 'block';
                alertBox.innerText = "Data berhasil dikirim ke server pusat.";
                document.getElementById('regForm').reset();
            } catch (error) {
                alertBox.style.display = 'block';
                alertBox.style.borderLeftColor = "red";
                alertBox.innerText = "Gagal mengirim data: " + error.message;
                console.error("Error adding document: ", error);
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
                setTimeout(() => { alertBox.style.display = 'none'; }, 3000);
            }
        });
    </script>
</body>
</html>
